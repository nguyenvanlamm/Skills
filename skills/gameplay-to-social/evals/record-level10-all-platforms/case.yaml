schema_version: "1.1"
name: record-level10-all-platforms
expected_outcome: |
  Run inside a set-up game project (social/config.yaml and lib/main_capture.dart exist; the configured device is Chrome on this machine and the game has no sound). The skill records level 10 with the game's bot, cuts from CAPTURE_LEVEL_START, passes QC (about 20 s, no black or frozen stretch, no DEBUG banner), exports 9:16, 16:9 and 4:5 plus a cover into social/output/lv10_<stamp>/video/, writes brief.md from the frames, checks or reports trends, writes posts.json with at least 3 variants per platform for TikTok, Reddit, LinkedIn and X, scores them and picks one per platform, and validate_posts exits 0. TikTok and X posts are emotional, use live trend words and mix game, genre/community and trend hashtags. No hard fact appears that is not in config.yaml facts (no download counts, ratings, prices, team size).
