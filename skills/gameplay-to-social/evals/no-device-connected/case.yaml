schema_version: "1.1"
name: no-device-connected
expected_outcome: |
  Run inside a set-up game project whose config names an Android phone and whose platforms are only android and ios, on a machine with no Android device or emulator connected. The skill lists devices, finds none usable, says so clearly (the saved phone is not connected; desktop/web are not available for this project), gives concrete steps to connect a phone or start or create an emulator (flutter emulators --launch, avdmanager with the pixel_2 1080x1920 profile), does not install anything, does not hang waiting for a device, and does not fabricate posts without a video (it may offer to continue from a video file the user records).
