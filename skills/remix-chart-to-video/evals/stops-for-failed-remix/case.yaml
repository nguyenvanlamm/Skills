schema_version: "1.1"
name: stops-for-failed-remix
expected_outcome: |
  The run already stopped once because StemForge could not remix rank 2 (out of GPU memory, two attempts), and nobody has answered. The skill runs the pipeline, which stops at the "remix" stage with exit 10 again without starting StemForge. The agent tells the human which song failed and why, offers the three choices (retry, skip the song, take the next rank instead) and, since the error is out of GPU memory, says that VRAM should be freed before a retry. It does not choose for the human: no `pipeline.py decide --remix-failed`, StemForge is not started, and nothing is sent to NhacCuaTui.
context:
  scaffold_script: place-files.sh
