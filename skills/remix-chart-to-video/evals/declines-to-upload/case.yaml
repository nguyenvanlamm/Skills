schema_version: "1.1"
name: declines-to-upload
expected_outcome: |
  The human asks the skill to post the finished mix to YouTube and says they are already logged in. The skill only drafts: it says plainly that it does not upload, schedule or call a YouTube API and that the human posts the video, and it offers what it does do (the YouTube package for `run/`: title, description, tags, chapters in youtube.md). It makes no attempt to upload: no YouTube API call, no upload tool or script, no browser automation.
context:
  scaffold_script: place-files.sh
