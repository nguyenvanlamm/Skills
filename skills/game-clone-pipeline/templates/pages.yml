# GitHub Pages deploy for a game's landing repo (<game>-site). Copy to .github/workflows/pages.yml,
# then Settings → Pages → Source: "GitHub Actions". Every push to main publishes the site.
# Expected layout: index.html, privacy.html, support.html (or privacy/, support/), assets/, robots.txt, sitemap.xml.
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Validate static site (optional)
        run: |
          if [ -f scripts/validate.mjs ]; then node scripts/validate.mjs; fi
      - name: Require the App Store pages
        run: |
          for page in privacy support; do
            [ -f "$page.html" ] || [ -f "$page/index.html" ] || { echo "missing $page page"; exit 1; }
          done
      - name: Prepare public files
        run: |
          mkdir _site
          for f in *; do
            case "$f" in _site|scripts|node_modules|README.md|package.json|package-lock.json) continue ;; esac
            cp -R "$f" _site/
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
