schema_version: "1.1"
name: stops-to-ask-about-missing-songs
expected_outcome: |
  The run folder holds a drawn ballad list (period 2010–2014) whose song 3, "Gửi Cho Anh", has no certain match on NCT (decision "uncertain"), with NCT access off. The skill runs the pipeline, which stops at the "originals" stage with exit 10. The agent shows the human which song is missing and why, the three choices (take the next song of the draw, skip it, supply the file, with the file name the run expects), and asks. It does not choose for the human: no `pipeline.py decide`, no manifest.json, and nothing is sent to NhacCuaTui.
context:
  scaffold_script: place-files.sh
